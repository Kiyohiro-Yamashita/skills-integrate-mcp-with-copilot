<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="staff-login-container">
        <h3>Staff access</h3>
        <form id="staff-login-form">
          <div class="form-group">
            <label for="staff-username">Username:</label>
            <input type="text" id="staff-username" autocomplete="username" required />
          </div>
          <div class="form-group">
            <label for="staff-password">Password:</label>
            <input type="password" id="staff-password" autocomplete="current-password" required />
          </div>
          <button type="submit">Sign in</button>
        </form>
        <p id="staff-status" role="status">Sign in to manage student registrations.</p>
      </section>

      <section id="signup-container" class="hidden">
        <div class="staff-heading">
          <h3>Manage registrations</h3>
          <button type="button" id="staff-logout">Sign out</button>
        </div>
        <h3>Register a student</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
